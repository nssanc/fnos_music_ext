name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r proxy/requirements.txt pytest
      - name: Check shell syntax
        run: bash -n install.sh extend.sh restore.sh proxy/run_proxy.sh musicdl-service/smoke_test.sh
      - name: Compile Python sources
        run: python -m py_compile proxy/app.py proxy/recommend.py proxy/online_sources.py proxy/source_registry.py scripts/ui_hook.py musicdl-service/app.py musicdl-service/hardening.py
      - name: Check JavaScript syntax and LX compatibility runner
        run: node --check proxy/static/ext-settings.js && node --test lx-source-service/server.test.js
      - name: Run tests
        run: python -m pytest proxy/tests musicdl-service/test_hardening.py -q
